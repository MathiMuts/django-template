# docker-compose.override.yml
#
# Development only: `docker compose up` merges this file automatically.
# Production uses `docker compose -f docker-compose.yml ...`, which skips it.
# Run `python manage.py tailwind start` on your machine for live css.

services:
  web:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "True"
    volumes:
      - ./:/app
