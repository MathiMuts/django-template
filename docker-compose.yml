# docker-compose.yml
#
# Everything is configured in .env. The `db` and `redis` services only start
# when listed in COMPOSE_PROFILES (e.g. COMPOSE_PROFILES=postgres,redis).

name: ${PROJECT_NAME:?set PROJECT_NAME in .env}

services:
  web:
    build: .
    container_name: ${PROJECT_NAME}
    env_file: .env
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data  # SQLite db, uploaded media, secret key
    restart: unless-stopped

  db:
    profiles: [postgres]
    image: postgres:15-alpine  # bumping the major version requires a dump/restore of existing data
    container_name: ${PROJECT_NAME}_postgres
    environment:
      POSTGRES_DB: ${PROJECT_NAME}
      POSTGRES_USER: ${PROJECT_NAME}
      # Not published on any port, only reachable from `web`, so no password needed.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    profiles: [redis]
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    command: redis-server --save "" --appendonly no  # pure cache, nothing persisted
    restart: unless-stopped

volumes:
  postgres_data:
